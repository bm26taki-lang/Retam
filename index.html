<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a1229">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RETAM">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>RETAM - تطبيق التمارين</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a1229;--card:#111c3d;--card2:#16244d;--line:#22346b;--tx:#f2f5ff;--mut:#8b9ac7;--pri:#4157ff;--pri2:#5b6dff;--red:#e8363f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root:not([data-theme="light"]){color-scheme:dark}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#eef1fb;--card:#fff;--card2:#e6ebfa;--line:#cfd7f0;--tx:#0d1633;--mut:#5d6b99}}
:root[data-theme="light"]{--bg:#eef1fb;--card:#fff;--card2:#e6ebfa;--line:#cfd7f0;--tx:#0d1633;--mut:#5d6b99}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:'Cairo',system-ui,sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:430px;height:100%;display:flex;flex-direction:column;position:relative;background:var(--bg)}
@media(min-width:600px){#app{border-inline:1px solid var(--line)}}
header{display:flex;align-items:center;gap:10px;padding:14px 16px;font-weight:700;font-size:18px}
header .t{flex:1;text-align:center}
.ib{width:36px;height:36px;border:0;background:none;color:var(--tx);font-size:20px;border-radius:10px;cursor:pointer;font-family:inherit}
main{flex:1;overflow-y:auto;padding:0 16px 16px}
nav{display:flex;border-top:1px solid var(--line);background:var(--card);padding:6px 6px 8px}
nav button{flex:1;border:0;background:none;color:var(--mut);font:600 11px Cairo,sans-serif;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px;border-radius:12px;cursor:pointer}
nav button span{font-size:20px}
nav button.on{color:var(--pri2);background:rgba(65,87,255,.14)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--pri2);outline-offset:2px}
.btn{width:100%;border:0;border-radius:14px;padding:14px;font:700 17px Cairo,sans-serif;color:#fff;background:var(--pri);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.red{background:var(--red)}.btn.ghost{background:var(--card2);color:var(--tx)}
.row{display:flex;gap:10px}.row>*{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
h3{margin:18px 0 10px;font-size:16px}
.hero{height:300px;border-radius:0 0 22px 22px;margin:0 -16px;padding:18px 16px;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;background:radial-gradient(120% 90% at 50% 0,#2a3f9c 0,#0b1330 70%),var(--bg);position:relative;overflow:hidden}
.hero .logo{position:absolute;top:14px;inset-inline:0;text-align:center;font:800 28px Cairo;letter-spacing:3px;color:#fff}
.hero .fig{position:absolute;inset:50px 0 auto;text-align:center;font-size:110px;opacity:.9}
.hero h2{margin:0;font-size:24px;color:#fff;position:relative}.hero p{margin:0 0 6px;color:#c9d3ff;position:relative}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.tile{border:0;border-radius:14px;aspect-ratio:1/0.95;color:#fff;font:700 13px Cairo;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer}
.tile span{font-size:34px}
.item{display:flex;gap:12px;align-items:center;margin-bottom:10px;cursor:pointer;text-align:start}
.thumb{width:68px;height:60px;border-radius:10px;background:linear-gradient(135deg,#243a8f,#0e1840);display:grid;place-items:center;font-size:28px;flex:none;overflow:hidden}
.thumb img,.thumb video{width:100%;height:100%;object-fit:cover}
.item .i{flex:1;min-width:0}.item b{display:block;font-size:15px;direction:ltr;text-align:start}
.item small{color:var(--mut);font-size:12px}
.play{width:36px;height:36px;border-radius:50%;border:0;background:var(--pri);color:#fff;font-size:14px;cursor:pointer}
.drop{border:2px dashed var(--pri);border-radius:16px;padding:22px 12px;text-align:center;color:var(--pri2);background:rgba(65,87,255,.06)}
.drop .big{font-size:40px}.drop p{margin:6px 0}
.drop img,.drop video{max-width:100%;max-height:150px;border-radius:10px;margin-bottom:8px}
label.f{display:block;margin:16px 0 6px;color:var(--pri2);font-weight:600}
input[type=text],input[type=time],select,textarea{width:100%;background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:13px;font:600 15px Cairo,sans-serif}
textarea{min-height:80px;resize:none}
.step{display:flex;align-items:center;gap:10px;margin-top:8px}
.step .v{flex:1;text-align:center;font-weight:800;font-size:20px}
.step button{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--pri2);background:none;color:var(--pri2);font-size:20px;cursor:pointer;line-height:1}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;margin:4px 0 14px}
.seg button{flex:1;border:0;background:none;color:var(--mut);padding:10px;border-radius:10px;font:700 14px Cairo;cursor:pointer}
.seg button.on{background:var(--pri);color:#fff}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{text-align:center}.stat .n{font-size:22px;font-weight:800;display:block}.stat small{color:var(--mut)}
.dcard{background:#fff;color:#0d1633;border-radius:18px;padding:10px;border:3px solid #cfd7ff}
.dcard .media{height:190px;border-radius:12px;background:linear-gradient(135deg,#243a8f,#0b1330);display:grid;place-items:center;font-size:64px;overflow:hidden}
.dcard .media img,.dcard .media video{width:100%;height:100%;object-fit:cover}
.dcard h2{margin:12px 4px 4px;font-size:20px;direction:ltr;text-align:start}
.dcard .meta{display:flex;justify-content:space-between;padding:6px 4px;color:#4157ff;font-weight:700}
.dcard .nums{display:flex;background:#eef1fb;border-radius:12px;margin:8px 0}
.dcard .nums div{flex:1;text-align:center;padding:10px}.dcard .nums b{display:block;font-size:22px}
.set{display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--line);font-weight:600;cursor:pointer;background:none;border-inline:0;border-top:0;width:100%;color:var(--tx);font-family:inherit;font-size:15px;text-align:start}
.set .ic{font-size:20px}.set .v{margin-inline-start:auto;color:var(--mut);font-size:13px}
.sw{width:46px;height:26px;border-radius:13px;background:var(--line);position:relative;border:0;cursor:pointer;flex:none}
.sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:inset .15s}
.sw.on{background:var(--pri)}.sw.on::after{inset-inline-start:23px}
.tog{display:flex;align-items:center;justify-content:space-between;margin-top:16px}
.toast{position:absolute;bottom:90px;inset-inline:20px;background:var(--pri);color:#fff;padding:12px;border-radius:12px;text-align:center;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.empty{text-align:center;color:var(--mut);padding:24px 0}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"><div id="screen" style="display:flex;flex-direction:column;flex:1;min-height:0"></div><div class="toast" id="toast"></div></div>
<script>
var M={chest:{n:'الصدر',e:'🏋️',c:'#e8363f'},back:{n:'الظهر',e:'💪',c:'#3a63f0'},legs:{n:'الأرجل',e:'🦵',c:'#1f9d55'},shoulders:{n:'الكتفان',e:'🙆',c:'#f0a020'},arms:{n:'الذراعان',e:'💪',c:'#7c3aed'},abs:{n:'البطن',e:'🔥',c:'#ea5a20'}};
var DAYS=['السبت','الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة'];
var seed=[{id:1,name:'Bench Press',m:'chest',sets:3,reps:12,rest:60,day:'السبت',time:'10:00',notes:'',remind:true,sug:true},
{id:2,name:'Incline Dumbbell Press',m:'chest',sets:3,reps:12,rest:60,day:'الاثنين',time:'18:00',notes:'',remind:true,sug:true},
{id:3,name:'Push Ups',m:'chest',sets:3,reps:15,rest:45,day:'الجمعة',time:'18:30',notes:'',remind:false,sug:true},
{id:4,name:'Dumbbell Fly',m:'chest',sets:3,reps:12,rest:60,day:'الخميس',time:'19:00',notes:'',remind:false,sug:true}];
var S={ex:seed.slice(),log:[],nextId:10,notif:true,theme:'auto'};
try{var sv=localStorage.getItem('retam');if(sv){S=Object.assign(S,JSON.parse(sv))}}catch(e){}
function save(){try{localStorage.setItem('retam',JSON.stringify(S))}catch(e){}}
var st=[{v:'home'}],tab='home',draft=null,mediaUrl=null,mediaType=null,mineTab='all',progTab='week';
var $=function(s){return document.querySelector(s)};
function toast(t){var e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(function(){e.classList.remove('show')},1800)}
function go(v,p){st.push(Object.assign({v:v},p||{}));render()}
function back(){if(st.length>1)st.pop();render()}
function root(t){tab=t;st=[{v:t}];render()}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function thumb(x){return '<div class="thumb">'+(x.img?(x.vid?'<video src="'+x.img+'" muted></video>':'<img alt="" src="'+x.img+'">'):M[x.m].e)+'</div>'}
function head(t,opts){opts=opts||{};return '<header><button class="ib" aria-label="رجوع" onclick="back()">→</button><div class="t">'+t+'</div>'+(opts.act||'<span style="width:36px"></span>')+'</header>'}
function nav(){var T=[['home','🏠','الرئيسية'],['mine','🗂️','تماريني'],['prog','📊','التقدم'],['set','⚙️','الإعدادات']];
return '<nav>'+T.map(function(t){return '<button class="'+(tab===t[0]?'on':'')+'" onclick="root(\''+t[0]+'\')"><span>'+t[1]+'</span>'+t[2]+'</button>'}).join('')+'</nav>'}
function exItem(x,play){return '<div class="card item" role="button" tabindex="0" onclick="go(\'detail\',{id:'+x.id+'})">'+thumb(x)+'<div class="i"><b>'+esc(x.name)+'</b><small>'+x.sets+' × '+x.reps+' | '+x.rest+' ثانية راحة</small>'+(play?'':'<br><small>'+M[x.m].n+' · '+x.day+' '+x.time+'</small>')+'</div>'+(play?'<button class="play" aria-label="ابدأ" onclick="event.stopPropagation();doLog('+x.id+')">▶</button>':'')+'</div>'}
function doLog(id){S.log.push({id:id,t:Date.now()});save();toast('تم تسجيل التمرين ✓')}
var V={
home:function(){return '<main style="padding-top:0"><div class="hero"><div class="logo">RETAM</div><div class="fig">🏋️</div><h2>مرحباً بك في RETAM</h2><p>أنت أقوى من أمس.</p><button class="btn" onclick="go(\'muscle\',{m:\'chest\'})">▶ ابدأ تمرينك</button></div><div class="grid">'+Object.keys(M).map(function(k){return '<button class="tile" style="background:'+M[k].c+'" onclick="go(\'muscle\',{m:\''+k+'\'})"><span>'+M[k].e+'</span>تمرين '+M[k].n+'</button>'}).join('')+'</div></main>'+nav()},
muscle:function(p){var m=M[p.m],l=S.ex.filter(function(x){return x.m===p.m});
return head('تمارين '+m.n)+'<main><div class="card" style="display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#243a8f,#0e1840);color:#fff"><span style="font-size:48px">'+m.e+'</span><div><b style="font-size:18px">اجعل '+m.n+'ك أقوى</b><br><small>مع التمارين المناسبة</small></div></div><h3>تمارينك الخاصة (من إضافتك)</h3><div class="drop" role="button" tabindex="0" onclick="newEx(\''+p.m+'\')"><div class="big">＋</div><b>إضافة تمرين جديد</b><p style="color:var(--mut);font-size:13px">أضف تمرينك المفضل مع فيديو أو صورة</p></div><h3>التمارين المقترحة</h3>'+(l.length?l.map(function(x){return exItem(x,true)}).join(''):'<div class="empty">لا توجد تمارين بعد. أضف تمرينك الأول.</div>')+'</main>'+nav()},
add1:function(p){var d=draft;return head('إضافة تمرين جديد - '+M[d.m].n)+'<main><div class="drop">'+(d.img?(d.vid?'<video src="'+d.img+'" controls></video>':'<img alt="" src="'+d.img+'">'):'<div class="big">🖼️ 🎬</div>')+'<p>أضف صورة أو فيديو للتمرين</p><div class="row"><button class="btn ghost" onclick="$(\'#fg\').click()">اختر من المعرض</button><button class="btn" onclick="$(\'#fc\').click()">سجل فيديو</button></div></div><input id="fg" type="file" accept="image/*,video/*" hidden onchange="pick(this)"><input id="fc" type="file" accept="video/*" capture hidden onchange="pick(this)"><label class="f" for="nm">اسم التمرين</label><input id="nm" type="text" dir="auto" placeholder="مثال: Bench Press" value="'+esc(d.name)+'" oninput="draft.name=this.value"><label class="f" for="dy">اليوم</label><select id="dy" onchange="draft.day=this.value">'+DAYS.map(function(x){return '<option'+(x===d.day?' selected':'')+'>'+x+'</option>'}).join('')+'</select><label class="f" for="tm">الساعة</label><input id="tm" type="time" value="'+d.time+'" onchange="draft.time=this.value"><div style="height:18px"></div><button class="btn" onclick="next1()">التالي ←</button></main>'},
add2:function(){var d=draft;function stp(k,l,u,step){return '<div class="card" style="margin-top:12px"><b>'+l+'</b><div class="step"><button aria-label="زيادة" onclick="chg(\''+k+'\','+step+')">+</button><div class="v">'+d[k]+' <small style="color:var(--mut);font-size:13px">'+u+'</small></div><button aria-label="نقصان" onclick="chg(\''+k+'\',-'+step+')">−</button></div></div>'}
return head('إضافة تمرين جديد - '+M[d.m].n)+'<main><h3>تفاصيل التمرين</h3>'+stp('reps','عدد التكرارات','تكرار',1)+stp('rest','مدة الراحة بين الجولات','ثانية',5)+stp('sets','عدد الجولات','جولة',1)+'<label class="f" for="nt">ملاحظات (اختياري)</label><textarea id="nt" placeholder="أي ملاحظات إضافية..." oninput="draft.notes=this.value">'+esc(d.notes)+'</textarea><div class="tog"><div><b>تفعيل التذكير</b><br><small style="color:var(--mut)">إشعار قبل التمرين</small></div><button class="sw'+(d.remind?' on':'')+'" role="switch" aria-checked="'+d.remind+'" aria-label="التذكير" onclick="draft.remind=!draft.remind;render()"></button></div><div style="height:18px"></div><button class="btn" onclick="saveEx()">حفظ التمرين ✓</button></main>'},
detail:function(p){var x=S.ex.find(function(e){return e.id===p.id});if(!x){return head('')+'<main><div class="empty">التمرين غير موجود</div></main>'}
return head('تمرين '+M[x.m].n)+'<main><div class="dcard"><div class="media">'+(x.img?(x.vid?'<video src="'+x.img+'" controls></video>':'<img alt="" src="'+x.img+'">'):'▶')+'</div><h2>'+esc(x.name)+'</h2><div class="meta"><span>📅 '+x.day+'</span><span>🕐 '+x.time+'</span></div><div class="nums"><div><b>'+x.sets+'</b>الجولات</div><div><b>'+x.reps+'</b>التكرارات</div><div><b>'+x.rest+'</b>الراحة (ث)</div></div>'+(x.notes?'<p style="margin:6px 4px">'+esc(x.notes)+'</p>':'')+'<div class="row"><button class="btn red" onclick="del('+x.id+')">🗑 حذف</button><button class="btn" onclick="edit('+x.id+')">✎ تعديل</button></div></div><div style="height:12px"></div><button class="btn ghost" onclick="doLog('+x.id+')">▶ سجّل أنني أنهيت التمرين</button></main>'},
mine:function(){var l=S.ex;var body;
if(mineTab==='all'){body=l.length?l.map(function(x){return exItem(x,false)}).join(''):'<div class="empty">لا توجد تمارين بعد. أضف تمرينك الأول.</div>'}
else{body=Object.keys(M).map(function(k){var q=l.filter(function(x){return x.m===k});return q.length?'<h3>'+M[k].n+'</h3>'+q.map(function(x){return exItem(x,false)}).join(''):''}).join('')||'<div class="empty">لا توجد تمارين بعد.</div>'}
return head('تمارينـي')+'<main><div class="seg"><button class="'+(mineTab==='all'?'on':'')+'" onclick="mineTab=\'all\';render()">كل التمارين</button><button class="'+(mineTab==='m'?'on':'')+'" onclick="mineTab=\'m\';render()">حسب العضلة</button></div>'+body+'<div style="height:6px"></div><button class="btn" onclick="newEx(\'chest\')">إضافة تمرين جديد ＋</button></main>'+nav()},
prog:function(){var now=Date.now(),r={week:7,month:30,all:9999}[progTab]*864e5;var lg=S.log.filter(function(g){return now-g.t<r});
var cal=0,days={};lg.forEach(function(g){var x=S.ex.find(function(e){return e.id===g.id});if(x)cal+=x.sets*x.reps*4;days[new Date(g.t).toDateString()]=1});
var rec=lg.slice().reverse().slice(0,6).map(function(g){return S.ex.find(function(e){return e.id===g.id})}).filter(Boolean);
return head('التقدم')+'<main><div class="seg">'+[['all','الكل'],['month','الشهر'],['week','الأسبوع']].map(function(t){return '<button class="'+(progTab===t[0]?'on':'')+'" onclick="progTab=\''+t[0]+'\';render()">'+t[1]+'</button>'}).join('')+'</div><div class="stats"><div class="card stat">🔥<span class="n">'+cal+'</span><small>السعرات</small></div><div class="card stat">🏋️<span class="n">'+lg.length+'</span><small>التمارين</small></div><div class="card stat">📅<span class="n">'+Object.keys(days).length+'</span><small>أيام التدريب</small></div></div><h3>أحدث التمارين</h3>'+(rec.length?rec.map(function(x){return exItem(x,false)}).join(''):'<div class="empty">لم تسجل أي تمرين في هذه الفترة. اضغط ▶ بجانب أي تمرين لتبدأ.</div>')+'</main>'+nav()},
set:function(){function r(i,t,v,f){return '<button class="set" onclick="'+f+'"><span class="ic">'+i+'</span>'+t+'<span class="v">'+v+'</span></button>'}
return head('الإعدادات')+'<main><div class="card" style="display:flex;align-items:center;gap:12px;margin-bottom:12px"><div class="thumb" style="border-radius:50%;width:54px;height:54px;background:var(--pri)">👤</div><div><b style="font-size:17px">مستخدم</b><br><small style="color:var(--mut)">مستوى مبتدئ</small></div></div><div class="card" style="padding:4px 12px">'+r('🌐','اللغة','العربية','toast(\'العربية هي اللغة الوحيدة حالياً\')')+'<div class="set" style="cursor:default"><span class="ic">🔔</span>الإشعارات<button class="sw'+(S.notif?' on':'')+'" style="margin-inline-start:auto" role="switch" aria-checked="'+S.notif+'" aria-label="الإشعارات" onclick="S.notif=!S.notif;save();render()"></button></div>'+r('☁️','البيانات والنسخ الاحتياطي','','exportData()')+r('🌓','المظهر',{auto:'تلقائي',dark:'داكن',light:'فاتح'}[S.theme],'theme()')+r('📤','مشاركة التطبيق','','toast(\'تم نسخ رابط التطبيق\')')+r('⭐','تقييم التطبيق','','toast(\'شكراً لتقييمك!\')')+r('ℹ️','حول التطبيق','','toast(\'RETAM الإصدار 1.0\')')+'</div></main>'+nav()}
};
function render(){var s=st[st.length-1];$('#screen').innerHTML=V[s.v](s);var m=$('main');if(m)m.scrollTop=0}
function newEx(m){draft={id:null,m:m,name:'',day:DAYS[0],time:'10:00',sets:3,reps:12,rest:60,notes:'',remind:true,img:null,vid:false};go('add1')}
function edit(id){var x=S.ex.find(function(e){return e.id===id});draft=JSON.parse(JSON.stringify(x));go('add1')}
function pick(i){var f=i.files[0];if(!f)return;var rd=new FileReader();rd.onload=function(){draft.img=f.size<1.5e6?rd.result:URL.createObjectURL(f);draft.vid=f.type.indexOf('video')===0;render()};rd.readAsDataURL(f)}
function next1(){if(!draft.name.trim()){toast('اكتب اسم التمرين أولاً');return}go('add2')}
function chg(k,d){draft[k]=Math.max(1,draft[k]+d);render()}
function saveEx(){var d=draft;if(d.id){S.ex=S.ex.map(function(e){return e.id===d.id?d:e})}else{d.id=S.nextId++;S.ex.push(d)}
if(d.img&&d.img.indexOf('blob:')===0)d.img=null;save();toast('تم حفظ التمرين ✓');var keep=d.id;st=st.filter(function(s){return s.v!=='add1'&&s.v!=='add2'&&s.v!=='detail'});st.push({v:'detail',id:keep});draft=null;render()}
function del(id){if(!confirm('حذف هذا التمرين؟'))return;S.ex=S.ex.filter(function(e){return e.id!==id});save();back();toast('تم حذف التمرين')}
function theme(){var o=['auto','dark','light'];S.theme=o[(o.indexOf(S.theme)+1)%3];applyTheme();save();render()}
function applyTheme(){var r=document.documentElement;if(S.theme==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',S.theme)}
function exportData(){try{navigator.clipboard.writeText(JSON.stringify(S.ex));toast('تم نسخ بياناتك للحافظة')}catch(e){toast('تعذر النسخ في هذا المتصفح')}}
applyTheme();render();
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){window.addEventListener('load',function(){navigator.serviceWorker.register('./sw.js').catch(function(){})})}
</script>
</body>
</html>
